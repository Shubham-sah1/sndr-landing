name: Keep SNDR backend warm

# Render's free tier spins the service down after ~15 min of inactivity, so the
# next real request takes 30-50s to wake it. This workflow pings the lightweight
# /health endpoint every 10 minutes to keep it warm during the day.
#
# Note: GitHub-scheduled runs can be delayed by several minutes under load, so
# this reduces cold starts but does not guarantee zero. For rock-solid warmth,
# pair it with UptimeRobot (5-min interval) — see the repo notes / chat.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC)
  workflow_dispatch:          # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (retry until awake)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://sndr-f4rg.onrender.com/health || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 20
          done
          echo "Backend did not return 200 after retries (it may still be waking)."
          # Don't fail the workflow on a slow wake — exit 0 so the schedule keeps running.
          exit 0
